site_name: Python Build123d para Arquitetos e Engenheiros
use_directory_urls: false

copyright: Copyright &copy; 2026 Fernando Ferraz Ribeiro

theme:
  features:

    #- navigation.sections
    - toc.integrate
    #- navigation.tabs
  name: material   
  language: en-custom
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      #primary: orange
      #accent: deep orange
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      accent: deep orange
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

site_url: "https://255ribeiro.github.io/python_build123d_basics/"
repo_url: "https://github.com/255ribeiro/python_build123d_basics/"
repo_name: "255ribeiro/python_build123d_basics" 

nav:
  - Início: index.md

  - Google Colab: 
    - Introdução: ./tuto_colab_build/build123d_basic_gc.ipynb
    - Modo Builder: ./tuto_colab_build/build123d_basic_modo_builder.ipynb
    - Primitivas: ./tuto_colab_build/build123d_primitives_gc.ipynb
    - Treliças: ./tuto_colab_build/build123d_trusses_gc.ipynb
    - Modelagem: ./tuto_colab_build/2d_to_3d.ipynb
    - Exercício Multipavimentos: ./tuto_colab_build/build123d_multiplos_pav.ipynb
    - Exercício Multipavimentos Resolvido: ./tuto_colab_build/multi_pav_b3d_resolvido.ipynb
    - Exercício Multipavimentos com Perfil: ./tuto_colab_build/build123d_multiplos_pav_perfil.ipynb
    - Exercício pavimentos deslocados: ./tuto_colab_build/multi_pav_b3d_ramdom_disp_resolvido.ipynb
    - Criando Volumes com Loft: ./tuto_colab_build/multi_pav_loft.ipynb

    - Exportação IFC:
      - Exportação IFC: ./tuto_colab_build/step_to_ifc.ipynb
      - Exportação IFC em Malha: ./tuto_colab_build/step_to_ifc_mesh.ipynb
  - Instalando em ambiente local: ./tuto_colab_build/local_setup_vscode_uv_ocp_viewer.ipynb


  - Apêndice:
    - Matrizes de transformação: ./conceitos/matrizes_de_transformacao.md
    - Geometria Descritiva vs. Projetiva: ./conceitos/descritiva_vs_projetiva.md
    - GitHub Copilot para professores e estudantes: ./conceitos/Resumo_GitHub_Copilot_Educacao_2026.md

  - Arquivos para download: ./down_files/down_files.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - toc:
      toc_depth: 1
extra_css:
  - overrides/css/extra_css.css


plugins:
  - mkdocs-jupyter:
      execute: False
      # include:
      #   - "./docs/tuto_colab_build/*.ipynb"
      # execute_ignore:
      #   - "./docs/tuto_vscode/*.ipynb"
      include_source: True


